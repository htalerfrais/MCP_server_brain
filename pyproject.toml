[project]
name = "brain-mcp"
version = "0.1.0"
description = "Serveur MCP du second cerveau : vault Markdown versionné dans git, accès par politique de clients."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==4.1.1",
    "pyyaml>=6",
    "uvicorn>=0.30",
]

[project.scripts]
brain-mcp = "brain_mcp.server:main"
brain-token = "brain_mcp.tokens:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
